<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fc">
<title>Hiragana Master</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:#202438;background:#f7f8fc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f7f8fc,#edf1ff)}
main{width:min(760px,94%);margin:32px auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
h1{font-size:clamp(24px,5vw,34px);margin:0;font-weight:850;letter-spacing:-1px}
.sub{color:#70778b;margin-top:5px;font-size:14px}
.panel{background:white;border:1px solid #e7eaf2;border-radius:22px;padding:22px;box-shadow:0 12px 35px #27345b0c;margin:14px 0}
label{display:block;font-weight:700;margin:12px 0 7px}
select,input[type=number]{padding:11px 12px;border:1px solid #dce1ec;border-radius:11px;background:#fff;font:inherit;width:100%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:flex;align-items:center;gap:9px;font-weight:600;margin:12px 0}
button{border:0;border-radius:13px;padding:13px 17px;font:inherit;font-weight:750;cursor:pointer;background:#edf0f8;color:#30364a}
button.primary{background:#4358df;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.center{text-align:center}
.kana{font-size:clamp(100px,24vw,160px);font-weight:900;line-height:1.25;color:#202438;margin:10px 0;font-family:"Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif}
.progress{height:9px;background:#edf0f7;border-radius:20px;overflow:hidden;margin:14px 0}
.progress span{display:block;height:100%;background:#596be8;width:0;transition:width .2s}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.choice{font-size:20px;background:#f3f5fb;border:1px solid #e6eaf4}
.choice.correct{background:#e3f7ed;border-color:#6bc99b}.choice.wrong{background:#fff0ee;border-color:#f19a8f}
.feedback{min-height:26px;font-weight:750;margin:12px}
.muted{color:#788096;font-size:14px}
.hidden{display:none!important}
.stat{font-size:30px;font-weight:850}
@media(max-width:520px){main{padding:12px;margin:18px auto}.panel{padding:17px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><div><h1>Hiragana Master</h1><div class="sub">히라가나 46자 암기 · 일본어 발음 학습</div></div><div aria-hidden="true" style="font-size:30px">あ</div></header>
<section id="settings" class="panel">
<h2 style="margin:0 0 8px">학습 설정</h2>
<div class="grid">
<div><label for="order">출제 방식</label><select id="order"><option value="ordered">순서대로</option><option value="random">랜덤 출제</option></select></div>
<div><label for="count">문제 개수</label><select id="count"><option value="10">10문제</option><option value="20">20문제</option><option value="46" selected>46문제</option></select></div>
<div><label for="mode">학습 모드</label><select id="mode"><option value="normal">일반 모드</option><option value="timed">시간제한 모드</option></select></div>
<div><label for="seconds">문제 제한 시간</label><select id="seconds"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
</div>
<label class="check"><input type="checkbox" id="autoNext" checked> 정답 확인 후 3초 뒤 자동으로 다음 문제</label>
<label class="check"><input type="checkbox" id="autoVoice" checked> 문제마다 일본어 발음 자동 재생</label>
<label class="check"><input type="checkbox" id="effects" checked> 정답·오답 효과음 사용</label>
<p class="muted">자동 발음을 끄면 문제 카드에 발음 듣기 버튼이 표시됩니다.</p>
<button class="primary" id="review">이 설정으로 시작하기</button>
</section>
<section id="confirm" class="panel hidden center">
<h2>이 설정으로 시작하시겠습니까?</h2><p id="summary" class="muted"></p>
<div class="actions" style="justify-content:center"><button id="back">다시 선택하기</button><button class="primary" id="begin">확인하고 시작</button></div>
</section>
<section id="quiz" class="panel hidden center">
<div style="display:flex;justify-content:space-between;gap:10px"><span id="counter" class="muted"></span><span id="timer" class="muted"></span></div>
<div class="progress"><span id="bar"></span></div>
<div class="kana" id="kana">あ</div>
<button id="hear" class="hidden">🔊 일본어 발음 듣기</button>
<div class="muted">이 히라가나의 발음을 선택하세요.</div>
<div id="choices" class="choices"></div><div id="feedback" class="feedback"></div>
<div class="actions" style="justify-content:center"><button id="next" class="primary" disabled>다음 문제로 넘어가기 →</button></div>
</section>
<section id="result" class="panel hidden center">
<h2>학습 결과</h2><div class="stat" id="score"></div><p id="rate" class="muted"></p>
<div class="actions" style="justify-content:center"><button class="primary" id="retry">다시 학습하기</button></div>
</section>
<p class="muted center">기기와 브라우저에 일본어 음성이 설치되어 있어야 발음이 재생됩니다.</p>
</main>
<script>
const data=[['あ','a','아'],['い','i','이'],['う','u','우'],['え','e','에'],['お','o','오'],['か','ka','카'],['き','ki','키'],['く','ku','쿠'],['け','ke','케'],['こ','ko','코'],['さ','sa','사'],['し','shi','시'],['す','su','스'],['せ','se','세'],['そ','so','소'],['た','ta','타'],['ち','chi','치'],['つ','tsu','츠'],['て','te','테'],['と','to','토'],['な','na','나'],['に','ni','니'],['ぬ','nu','누'],['ね','ne','네'],['の','no','노'],['は','ha','하'],['ひ','hi','히'],['ふ','fu','후'],['へ','he','헤'],['ほ','ho','호'],['ま','ma','마'],['み','mi','미'],['む','mu','무'],['め','me','메'],['も','mo','모'],['や','ya','야'],['ゆ','yu','유'],['よ','yo','요'],['ら','ra','라'],['り','ri','리'],['る','ru','루'],['れ','re','레'],['ろ','ro','로'],['わ','wa','와'],['を','wo','오'],['ん','n','응']];
const $=id=>document.getElementById(id);
let settings={},questions=[],index=0,correct=0,answered=false,remaining=0,tick=null,advance=null;
function show(id){['settings','confirm','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function speak(k){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(k);u.lang='ja-JP';u.rate=.82;speechSynthesis.speak(u)}
let audio;
function tone(ok){if(!settings.effects)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();[0,1].forEach((n)=>{let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=ok?(n?760:570):(n?180:250);g.gain.setValueAtTime(.0001,audio.currentTime+n*.13);g.gain.exponentialRampToValueAtTime(.12,audio.currentTime+n*.13+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+n*.13+.12);o.start(audio.currentTime+n*.13);o.stop(audio.currentTime+n*.13+.13)})}catch(e){}}
function stopTimers(){clearInterval(tick);clearTimeout(advance)}
$('review').onclick=()=>{settings={order:$('order').value,count:+$('count').value,mode:$('mode').value,seconds:+$('seconds').value,autoNext:$('autoNext').checked,autoVoice:$('autoVoice').checked,effects:$('effects').checked};$('summary').textContent=`${settings.order==='ordered'?'순서대로':'랜덤'} · ${settings.count}문제 · ${settings.mode==='timed'?settings.seconds+'초 제한':'일반 모드'} · 자동 발음 ${settings.autoVoice?'켜짐':'꺼짐'}` ;show('confirm')};
$('back').onclick=()=>show('settings');
$('begin').onclick=()=>{questions=[...data];if(settings.order==='random')questions.sort(()=>Math.random()-.5);questions=questions.slice(0,settings.count);index=0;correct=0;show('quiz');render()};
function render(){stopTimers();answered=false;let q=questions[index];$('counter').textContent=`${index+1} / ${questions.length}`;$('bar').style.width=(index/questions.length*100)+'%';$('kana').textContent=q[0];$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===questions.length-1?'결과 확인하기 →':'다음 문제로 넘어가기 →';$('hear').classList.toggle('hidden',settings.autoVoice);$('choices').innerHTML='';let opts=[q];while(opts.length<4){let x=data[Math.floor(Math.random()*data.length)];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);opts.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x[1]+' ('+x[2]+')';b.onclick=()=>answer(x===q,b);$('choices').appendChild(b)});if(settings.autoVoice)speak(q[0]);if(settings.mode==='timed'){remaining=settings.seconds;$('timer').textContent=remaining+'초';tick=setInterval(()=>{remaining--;$('timer').textContent=remaining+'초';if(remaining<=0){stopTimers();answer(false,null,true)}},1000)}else $('timer').textContent=''}
$('hear').onclick=()=>speak(questions[index][0]);
function answer(ok,button,timeout=false){if(answered)return;answered=true;clearInterval(tick);if(ok)correct++;tone(ok);$('feedback').textContent=timeout?'시간 초과':ok?'정답입니다!':'아쉬워요. 정답: '+questions[index][1]+' ('+questions[index][2]+')';$('feedback').style.color=ok?'#168653':'#d04d43';[...$('choices').children].forEach(b=>{b.disabled=true;if(b===button)b.classList.add(ok?'correct':'wrong')});$('next').disabled=false;if(settings.autoNext)advance=setTimeout(next,3000)}
function next(){if(!answered)return;stopTimers();if(index===questions.length-1){$('score').textContent=correct+' / '+questions.length+'점';$('rate').textContent='정답률 '+Math.round(correct/questions.length*100)+'%';show('result')}else{index++;render()}}
$('next').onclick=next;$('retry').onclick=()=>show('settings');
</script>
</body></html>
